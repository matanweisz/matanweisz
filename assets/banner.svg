<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">Matan Weisz</title>
  <desc id="d">DevOps and Cloud Infrastructure Engineer moving into AI platform engineering</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1a24"/>
      <stop offset="1" stop-color="#0e3a44"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#2bb5a8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2bb5a8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#7fd1c7" fill-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#dots)"/>
  <rect width="1200" height="300" rx="18" fill="url(#glow)"/>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
