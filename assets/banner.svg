<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">Matan Weisz</title>
  <desc id="d">DevOps engineer working on cloud and AI infrastructure. Requests flow through a gateway to a pool of GPU model servers.</desc>
  <style>
    .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .type { animation: type 3.2s steps(50, end) 0.6s both; }
    .cursor { animation: blink 1s step-end infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: 870px 160px; }
    @keyframes type { from { width: 0 } to { width: 600px } }
    @keyframes blink { 50% { opacity: 0 } }
    @keyframes pulse { 0%, 100% { opacity: .35; transform: scale(1) } 50% { opacity: 0; transform: scale(1.9) } }
    @media (prefers-reduced-motion: reduce) {
      .type, .cursor, .pulse { animation: none; }
      .packet { display: none; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1620"/>
      <stop offset=".55" stop-color="#0c2a35"/>
      <stop offset="1" stop-color="#123f4a"/>
    </linearGradient>
    <radialGradient id="glow" cx=".78" cy=".5" r=".42">
      <stop offset="0" stop-color="#36d1bd" stop-opacity=".25"/>
      <stop offset="1" stop-color="#36d1bd" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#8fe3d6" fill-opacity=".07"/>
    </pattern>
    <clipPath id="typed"><rect class="type" x="76" y="214" width="600" height="34"/></clipPath>
    <path id="p1" d="M760 160 H 870 C 930 160, 945 92, 1010 92"/>
    <path id="p2" d="M760 160 H 870 C 930 160, 945 138, 1010 138"/>
    <path id="p3" d="M760 160 H 870 C 930 160, 945 184, 1010 184"/>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#dots)"/>
  <rect width="1200" height="320" rx="20" fill="url(#glow)"/>

  <text x="74" y="104" class="mono" font-size="16" fill="#5fbfb2" letter-spacing="2">HEY, I'M</text>
  <text x="70" y="166" class="sans" font-size="68" font-weight="800" fill="#f3fcfb" letter-spacing="-1.5">Matan Weisz</text>
  <text x="74" y="200" class="sans" font-size="22" fill="#a8e6dc">DevOps engineer · cloud and AI infrastructure</text>
  <g clip-path="url(#typed)">
    <text x="76" y="238" class="mono" font-size="18" fill="#6fd4c4">$ helm upgrade --install matan ./career --atomic<tspan class="cursor">▍</tspan></text>
  </g>

  <!-- gateway routing requests to model servers on GPUs -->
  <g stroke="#3fc1b2" stroke-opacity=".5" stroke-width="2" fill="none">
    <path d="M760 160 H 854" stroke-dasharray="4 6"/>
    <path d="M886 160 C 930 160, 945 92, 1010 92"/>
    <path d="M886 160 C 930 160, 945 138, 1010 138"/>
    <path d="M886 160 C 930 160, 945 184, 1010 184"/>
    <path d="M886 160 C 930 160, 945 230, 1010 230" stroke-opacity=".25" stroke-dasharray="4 5"/>
  </g>
  <circle class="pulse" cx="870" cy="160" r="16" fill="none" stroke="#5fe0cf" stroke-width="2"/>
  <circle cx="870" cy="160" r="16" fill="#0e3a44" stroke="#5fe0cf" stroke-width="2.5"/>
  <circle cx="870" cy="160" r="5" fill="#5fe0cf"/>

  <g class="packet" fill="#c9fff6">
    <circle r="3.5"><animateMotion dur="2.6s" repeatCount="indefinite" begin="0s"><mpath href="#p1"/></animateMotion></circle>
    <circle r="3.5"><animateMotion dur="2.6s" repeatCount="indefinite" begin="0.9s"><mpath href="#p2"/></animateMotion></circle>
    <circle r="3.5"><animateMotion dur="2.6s" repeatCount="indefinite" begin="1.7s"><mpath href="#p3"/></animateMotion></circle>
  </g>

  <g fill="#0b2731" stroke="#3fc1b2" stroke-width="2">
    <rect x="1010" y="76" width="96" height="32" rx="8"/>
    <rect x="1010" y="122" width="96" height="32" rx="8"/>
    <rect x="1010" y="168" width="96" height="32" rx="8"/>
    <rect x="1010" y="214" width="96" height="32" rx="8" stroke-opacity=".35" stroke-dasharray="4 4"/>
  </g>
  <g class="mono" font-size="12" fill="#8fe3d6">
    <text x="1024" y="97">gpu-0</text><text x="1024" y="143">gpu-1</text><text x="1024" y="189">gpu-2</text>
  </g>
  <text x="1024" y="235" class="mono" font-size="12" fill="#8fe3d6" fill-opacity=".45">scale…</text>
  <g fill="#5fe0cf">
    <circle cx="1090" cy="92" r="3.5"/><circle cx="1090" cy="138" r="3.5"/><circle cx="1090" cy="184" r="3.5"/>
  </g>
</svg>
