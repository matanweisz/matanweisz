    <text x="74" y="176" font-size="26" fill="#9fdcd4">DevOps &amp; Cloud Infrastructure Engineer</text>
  </g>
  <text x="74" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#6fb3ab">kubernetes · terraform · aws · gcp · gitops  →  ai platform</text>

  <!-- a gateway node routing to a small pool of model servers -->
